name: Bug bounty Telegram alerts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_only:
        description: Send a Telegram test message without changing the baseline
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bounty-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify monitor
        run: python -m unittest discover -s tests -v
      - name: Check feeds and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_ONLY: ${{ inputs.test_only }}
        run: |
          if [ "$TEST_ONLY" = "true" ]; then
            python monitor.py --test-message
          else
            python monitor.py
          fi
      - name: Save baseline and delivery progress even after a failed delivery
        if: ${{ always() }}
        run: |
          if [ -f state.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save public scope monitor state'
              git push
            fi
          fi
